# Example compose file for pve-oci-compose (YAML).
# Requires: python3 + PyYAML (on PVE: apt install python3-yaml)
#
# Top-level "defaults" are shallow-merged into each service (service keys win).
#
# Optional top-level **about:** (multiline string) is merged into the Proxmox **Notes** section of
# the composed CT **description** for every service that opts into the rich description (see
# **guest_ports** / per-service **about** below). Omit it if you prefer no stack-wide blurb.
#
# Optional **repo:** — URL string for the “Source” footer on composed descriptions (default is the
# upstream GitHub repo). Use **repo: false** to omit that footer.

# Used as the default Datacenter → Permissions → **resource pool** id (pct --pool) unless you set
# `defaults.pool` / per-service `pool` (use `pool: ""` to opt out). Missing pools are auto-created
# (set PVE_OCI_POOL_NO_AUTOCREATE=1 on the host to disable).
name: example-stack

defaults:
  template_storage: "" # vztmpl storage id for oci-registry-pull; omit or "" to auto-pick when unique

  # --- pool (optional) ---
  # pool: ""                    # disable default pool id (= stack name) for every service
  # pool: "oci-example-stack"  # explicit pool id (must exist or be auto-created)

  # --- net0 (default for every service unless overridden) ---
  # Same string pct(1) expects for --net0. VLAN example on a VLAN-aware bridge:
  # net0: "name=eth0,bridge=vmbr0,tag=42,ip=dhcp"
  net0: "name=eth0,bridge=vmbr0,ip=dhcp"

  unprivileged: 1
  onboot: 0

services:
  nginx-demo:
    vmid: 200 # or: next | auto | null | omit key — apply allocates next free id and can write it back
    image: docker.io/library/nginx:latest
    rootfs: local-zfs:8
    hostname: nginx-oci-demo

    # =============================================================================
    # Optional pct create fields — examples (uncomment / copy into this service)
    # All of these map 1:1 to `pct create` flags; see README + `pct(1)` on your PVE version.
    # They apply only when a *new* CT is created (apply), not on refresh.
    # =============================================================================

    # --- Extra NICs: net1, net2, … (keys must match ^net[0-9]+$) ---
    # Second interface, same bridge, DHCP:
    # net1: "name=eth1,bridge=vmbr0,ip=dhcp"
    # Static IPv4 on eth0 (adjust to your LAN); gateway often on net0 only:
    # net0: "name=eth0,bridge=vmbr0,ip=192.168.1.50/24,gw=192.168.1.1"

    # --- DNS (pct --nameserver / --searchdomain) ---
    # One string with commas or spaces → multiple --nameserver flags:
    # nameserver: "10.0.0.1, 10.0.0.2"
    # Or a YAML list → one --nameserver per element:
    # nameserver: [10.0.0.1, 8.8.8.8]
    # searchdomain: "lan.local"
    # searchdomain: [lan.local, corp.example.com]

    # --- OCI-style process (pct --entrypoint) ---
    # entrypoint: "/sbin/init"
    # entrypoint: '/usr/sbin/nginx -g "daemon off;"'

    # --- Environment (pct --env, repeatable) ---
    # As a mapping (recommended):
    # env:
    #   NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    #   TZ: "UTC"
    # As a list of KEY=value strings:
    # env:
    #   - "FOO=bar"
    #   - "BAZ=qux"
    # Single string (passed through as one --env if you need a custom format):
    # env: "MYVAR=value"

    # --- CPU / RAM tuning ---
    # memory: 512
    # cores: 2
    # swap: 512
    # cpulimit: 4
    # cpuunits: 2048

    # --- OS / features (unchanged from before; shown for context) ---
    # ostype: debian
    # arch: amd64
    # features: "nesting=1"

    # --- UI metadata (pct --description / --tags) ---
    # **description** alone → passed through as a plain pct description (no extra header).
    #
    # If you set **guest_ports** and/or **about** (here or top-level **about:**), **apply** builds a
    # richer Markdown-style description: stack, service, image, your text, a **Listener ports**
    # section (what listens *inside* the CT — not Docker `ports:` maps), and **Notes** from
    # stack + service **about**. Use this to remember which ports to allow on a firewall or proxy.
    #
    # description: |
    #   Demo nginx from OCI; static site only.
    # guest_ports:
    #   - port: 80
    #     proto: tcp
    #     description: HTTP (default server)
    #   - "443/tcp — HTTPS (uncomment if you terminate TLS in the guest)"
    # about: |
    #   Docs: https://nginx.org/en/docs/
    # tags: "env=prod;team=netops"
    # apply still merges the short sentinel tag `pve-oci-compose` after create.

    # --- Timezone / access (pct --timezone / --password / --ssh-public-keys) ---
    # timezone: host
    # timezone: "Europe/Berlin"
    # Avoid committing real passwords — prefer `pct set` after first boot:
    # password: "CHANGE_ME"
    # Path on the *Proxmox host* to a file (one OpenSSH public key per line):
    # ssh_public_keys: "/root/.ssh/authorized_keys"

    # --- Boot / ordering (different from each other) ---
    # onboot: 1              # start this CT when the *node* boots (pct --onboot)
    # startup: "order=10,up=30,down=30"   # order + delays vs other guests (pct --startup)
    # start: 1               # start the CT immediately when `pct create` finishes (pct --start)

    # --- Hooks / HA / safety (pct --hookscript / --ha-managed / --protection / …) ---
    # hookscript: "local:snippets/lxc-hook.sh"
    # protection: 1
    # ha_managed: 0
    # ignore_unpack_errors: 0
    # pct_debug: 0

    # --- Console / I/O (pct --cmode / --console / --tty / --bwlimit) ---
    # cmode: tty
    # console: 1
    # tty: 2
    # bwlimit: 12500

    # --- Host devices into the CT (pct --dev0, --dev1, … list order) ---
    # lxc_dev:
    #   - "path=/dev/net/tun,mp=/dev/net/tun"
    #   - "path=/dev/kvm,mp=/dev/kvm"

    # --- Advanced: unused volume refs (pct --unused0, …) — rarely needed ---
    # unused_disks:
    #   - "local-zfs:vm-999-disk-0"

    # --- Node override & extra disks ---
    # node: pve
    # mounts:
    #   - "local-zfs:0.25:/var/cache/nginx"

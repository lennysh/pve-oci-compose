# Example compose file for pve-oci-compose (YAML).
# Requires: python3 + PyYAML (on PVE: apt install python3-yaml)
#
# Top-level "defaults" are shallow-merged into each service (service keys win).

# Used as the default Datacenter → Permissions → **resource pool** id (pct --pool) unless you set
# `defaults.pool` / per-service `pool` (use `pool: ""` to opt out). Missing pools are auto-created
# (set PVE_OCI_POOL_NO_AUTOCREATE=1 on the host to disable).
name: example-stack

defaults:
  template_storage: "" # vztmpl storage id for oci-registry-pull; omit or "" to auto-pick when unique
  # pool: ""        # optional: disable default pool (= stack name) for all services in this file
  # net0 is passed to pct --net0. Add tag=VLAN for 802.1Q on a VLAN-aware bridge (see PVE wiki: VLAN on bridge).
  # Example VLAN 42:  'name=eth0,bridge=vmbr0,tag=42,ip=dhcp'
  net0: "name=eth0,bridge=vmbr0,ip=dhcp"
  unprivileged: 1
  onboot: 0

services:
  nginx-demo:
    vmid: 200 # or: next | auto | null | omit key — apply allocates next free id and can write it back
    image: docker.io/library/nginx:latest
    rootfs: local-zfs:8
    hostname: nginx-oci-demo
    # Optional pct / pull options:
    # memory: 512
    # cores: 2
    # ostype: debian
    # features: "nesting=1"
    # node: pve
    # mounts:
    #   - "local-zfs:0.25:/var/cache/nginx"

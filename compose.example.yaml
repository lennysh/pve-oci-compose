# Example compose file for pve-oci-compose (YAML).
# Requires: python3 + PyYAML (on PVE: apt install python3-yaml)
#
# Copy:  cp compose.example.yaml compose.yaml
# Flow:  ./pve-oci-compose.sh plan | apply | pull | refresh
# One service:  ./pve-oci-compose.sh apply --service nginx-demo
# By vmid:       ./pve-oci-compose.sh refresh --vmid 200
#
# Top-level keys (see README.md):
#   name / project   — stack label; default resource pool id unless pool: overridden
#   about            — optional stack notes in composed CT descriptions
#   repo             — Source footer URL in descriptions (or repo: false to omit)
#   defaults         — shallow-merged into each service (env is layered: defaults then service)
#   services         — one entry per CT; processed in YAML order (not alphabetical)
#
# Per-service: vmid, image|reference, rootfs (not required for pull), template_storage|storage,
# refresh_pre_backup, refresh_backup_storage, pool, net0…, env|environment, mounts, bind_mounts,
# rootfs_files, mount_files (guest file inject; on_refresh for refresh-time re-apply),

# Optional stack-wide description footer (composed CT Notes):
# repo: https://github.com/your-org/your-fork
# repo: false
# about: |
#   Shared infrastructure for the example stack.

name: example-stack

defaults:
  template_storage: "" # vztmpl id for oci-registry-pull; "" = auto-pick when exactly one store exists

  # --- refresh pre-backup (optional) ---
  # refresh_pre_backup: snapshot   # default: pct snapshot only; abort on failure
  # refresh_pre_backup: auto       # snapshot first; vzdump to refresh_backup_storage if snapshot fails
  # refresh_pre_backup: vzdump      # vzdump only (no pct snapshot)
  # refresh_backup_storage: nfs-backups  # local/NFS vzdump store; use pbs for Proxmox Backup Server
  # refresh_vzdump_remove: false    # default: --remove 0 (no prune; may fail if storage max backups reached)
  # refresh_vzdump_protected: true    # default: mark pre-refresh vzdump as protected

  # --- pool (optional) ---
  # pool: ""                    # disable default pool id (= stack name) for every service
  # pool: "oci-example-stack"  # explicit pool id (must exist or be auto-created)

  # --- net0 (default for every service unless overridden) ---
  # net0: "name=eth0,bridge=vmbr0,tag=42,ip=dhcp"
  net0: "name=eth0,bridge=vmbr0,ip=dhcp"

  unprivileged: 1
  onboot: 0
  # start: 0                 # pct --start when create finishes (separate from onboot)

  # --- defaults env (merged after image env, before per-service env) ---
  # env:
  #   TZ: "America/New_York"

services:
  # Services run in this order: nginx-demo first, then alpine-next (when uncommented).

  nginx-demo:
    vmid: 200 # or: next | auto | null | omit — apply allocates next free id and can write it back
    image: docker.io/library/nginx:latest
    rootfs: local-zfs:8
    hostname: nginx-oci-demo

    # =============================================================================
    # Optional pct create fields — examples (uncomment / copy into this service)
    # All map 1:1 to pct create flags; see README + pct(1). Create-only (apply), not refresh.
    # =============================================================================

    # --- Extra NICs: net1, net2, … (keys must match ^net[0-9]+$) ---
    # net1: "name=eth1,bridge=vmbr0,ip=dhcp"
    # net0: "name=eth0,bridge=vmbr0,ip=192.168.1.50/24,gw=192.168.1.1"

    # --- DNS ---
    # nameserver: "10.0.0.1, 10.0.0.2"
    # nameserver: [10.0.0.1, 8.8.8.8]
    # searchdomain: "lan.local"
    # searchdomain: [lan.local, corp.example.com]

    # --- OCI-style process ---
    # entrypoint: "/sbin/init"
    # entrypoint: '/usr/sbin/nginx -g "daemon off;"'

    # --- Environment (env: or environment:) ---
    # Runtime merge order: image Config.Env → defaults.env → service env (override per key).
    # env:
    #   NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    # env: ["FOO=bar", "BAZ=qux"]
    # env: "MYVAR=value"

    # --- CPU / RAM ---
    # memory: 512
    # cores: 2
    # swap: 512
    # cpulimit: 4
    # cpuunits: 2048

    # --- OS / features ---
    # ostype: debian
    # arch: amd64
    # features: "nesting=1"

    # --- UI metadata (description / guest_ports / about) ---
    # description alone → verbatim pct description.
    # guest_ports and/or about → composed Markdown Notes (stack, service, image, ports, notes).
    # description: |
    #   Demo nginx from OCI; static site only.
    # guest_ports:
    #   - port: 80
    #     proto: tcp
    #     description: HTTP (default server)
    #   - "443/tcp — HTTPS"
    # about: |
    #   Docs: https://nginx.org/en/docs/
    # tags: "env=prod;team=netops"

    # --- Timezone / access ---
    # timezone: host
    # timezone: "Europe/Berlin"
    # password: "CHANGE_ME"
    # ssh_public_keys: "/root/.ssh/authorized_keys"

    # --- Boot / ordering ---
    # onboot: 1
    # startup: "order=10,up=30,down=30"
    # start: 1

    # --- Hooks / HA / safety ---
    # hookscript: "local:snippets/lxc-hook.sh"
    # protection: 1
    # ha_managed: 0
    # ignore_unpack_errors: 0
    # pct_debug: 0

    # --- Console / I/O ---

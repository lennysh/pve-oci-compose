    #     path: config.yml
    #     source: files/myapp-config.yml
    #   # owner: 1000
    #   # group: 1000
    #   # mode: "600"

  # Second service example: runs after nginx-demo (YAML order). Uncomment to try vmid writeback.
  # alpine-next:

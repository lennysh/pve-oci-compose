    # console: 1
    # tty: 2
    # bwlimit: 12500

    # --- Devices / unused volumes ---
    # lxc_dev:
    #   - "path=/dev/net/tun,mp=/dev/net/tun"
    # unused_disks:
    #   - "local-zfs:vm-999-disk-0"

    # --- Node override & disks ---
    # node: pve
    # mounts:
    #   - "local-zfs:0.25:/var/cache/nginx"
    #   - "Storage:0.1:/scratch:backup=0,replicate=0"
    # bind_mounts:
    #   - "/mnt/pve/nfs-media,mp=/mnt/Media01,replicate=0,shared=1,size=0T"
    # lxc_config_lines:
    #   - "lxc.cgroup2.devices.allow: c 188:* rwm"

    # --- Guest file inject (rootfs + mount paths; see README rootfs_files / mount_files) ---
    # rootfs_files:
    #   - path: /etc/resolv.conf
    #     source: files/resolv.conf
    #     on_refresh: true
    #     mode: "644"
    #   - path: /etc/myapp/bootstrap.conf
